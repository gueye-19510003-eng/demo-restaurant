<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Resto</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --cream: #f7ead6;
            --black: #141210;
            --red: #db1f2e;
            --gray: #75706a;
        }
        body {
            font-family: system-ui, sans-serif;
            background-color: var(--black);
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: var(--cream); text-align: center; }
        .card {
            background: #1e1c19;
            border: 1px solid #332f2b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #444;
            box-sizing: border-box;
        }
        button {
            background: var(--red);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .bg-success { background: #2e7d32; }
        .bg-danger { background: #c62828; }
    </style>
</head>
<body>

<div class="container">
    <h1>Espace Administration</h1>

    <!-- FORMULAIRE DE CONNEXION -->
    <div id="login-section" class="card">
        <h2>Connexion Admin</h2>
        <form id="login-form">
            <label>Email</label>
            <input type="email" id="email" required placeholder="admin@exemple.com">
            <label>Mot de passe</label>
            <input type="password" id="password" required>
            <button type="submit">Se connecter</button>
        </form>
    </div>

    <!-- TABLEAU DE BORD (Masqué par défaut) -->
    <div id="dashboard-section" class="card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Gestion du Menu</h2>
            <button id="logout-btn" style="width: auto; padding: 6px 12px; background: var(--gray);">Déconnexion</button>
        </div>

        <!-- Formulaire d'ajout de produit -->
        <form id="add-product-form" style="margin-top: 20px; border-bottom: 2px solid #333; padding-bottom: 20px;">
            <h3>Ajouter un plat</h3>
            <input type="text" id="p-name" placeholder="Nom du plat (ex: Cheese Burger)" required>
            <input type="text" id="p-category" placeholder="Catégorie (ex: Burgers, Boissons)" required>
            <input type="number" id="p-price" placeholder="Prix (ex: 3500)" required>
            <textarea id="p-desc" placeholder="Description / Ingrédients"></textarea>
            <button type="submit" style="background: #2e7d32;">Ajouter au menu</button>
        </form>

        <!-- Liste des produits -->
        <h3>Liste des plats</h3>
        <div id="products-list">Chargement...</div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://qoqlirshhiawpqlnuqph.supabase.co";
    const SUPABASE_KEY = "sb_publishable_vcDF1EkjoO_TcnvLYHf-ew_Po9I1SuC";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const productsList = document.getElementById('products-list');

    // Vérification de la session
    async function checkAuth() {
        const { data: { user } } = await db.auth.getUser();
        if (user) {
            loginSection.style.display = 'none';
            dashboardSection.style.display = 'block';
            loadProducts();
        } else {
            loginSection.style.display = 'block';
            dashboardSection.style.display = 'none';
        }
    }

    // Connexion
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const { error } = await db.auth.signInWithPassword({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        });
        if (error) alert("Erreur : " + error.message);
        else checkAuth();
    });

    // Déconnexion
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await db.auth.signOut();
        checkAuth();
    });

    // Charger les produits
    async function loadProducts() {
        const { data, error } = await db.from('products').select('*').order('created_at', { ascending: false });
        if (error) { productsList.innerHTML = "Erreur de chargement"; return; }

        productsList.innerHTML = data.map(item => `
            <div class="product-item">
                <div>
                    <strong>${item.name}</strong> (${item.price} FCFA) - <em>${item.category}</em><br>
                    <small style="color: #aaa;">${item.description || ''}</small>
                </div>
                <button onclick="toggleStatus('${item.id}', ${item.is_available})" style="width: auto; margin: 0;" class="badge ${item.is_available ? 'bg-success' : 'bg-danger'}">
                    ${item.is_available ? 'Disponible' : 'Rupture'}
                </button>
            </div>
        `).join('');
    }

    // Basculer la disponibilité
    async function toggleStatus(id, currentStatus) {
        await db.from('products').update({ is_available: !currentStatus }).eq('id', id);
        loadProducts();
    }

    // Ajouter un produit
    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newProduct = {
            name: document.getElementById('p-name').value,
            category: document.getElementById('p-category').value,
            price: parseFloat(document.getElementById('p-price').value),
            description: document.getElementById('p-desc').value,
            is_available: true
        };
        const { error } = await db.from('products').insert([newProduct]);
        if (error) alert("Erreur d'ajout : " + error.message);
        else {
            document.getElementById('add-product-form').reset();
            loadProducts();
        }
    });

    checkAuth();
</script>
</body>
</html>
