<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Admin — Votre Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f7ead6; --ink:#141210; --red:#db1f2e; --green:#3f7d4f; --gold:#f2b705;
    --line:rgba(20,18,16,0.14);
    --font-logo:'Anton',sans-serif; --font-mono:'IBM Plex Mono',monospace; --font-body:'Inter',sans-serif;
  }
  html{color-scheme:light; background:var(--cream);}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:var(--font-body); line-height:1.5;}
  button, input, select{font-family:inherit;}
  .wrap{max-width:820px; margin:0 auto; padding:28px 20px 60px;}

  .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;}
  .logo{font-family:var(--font-logo); font-size:1.1rem;}
  .logo span{display:block; font-size:0.6rem; color:var(--red); letter-spacing:0.14em; font-family:var(--font-mono);}
  .logout-btn{background:none; border:1px solid var(--line); padding:8px 14px; border-radius:8px; font-size:0.78rem; cursor:pointer;}

  /* Login */
  #login-view{ max-width:360px; margin:80px auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px; }
  #login-view h1{ font-size:1.2rem; margin-bottom:6px; }
  #login-view p{ font-size:0.82rem; color:#6b6058; margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ font-family:var(--font-mono); font-size:0.66rem; text-transform:uppercase; letter-spacing:0.06em; color:#6b6058; display:block; margin-bottom:6px; }
  .field input{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:0.9rem; }
  .btn{ width:100%; background:var(--ink); color:#fff; padding:12px; border-radius:8px; font-weight:700; font-size:0.86rem; border:none; cursor:pointer; }
  .btn-red{ background:var(--red); }
  .btn-green{ background:var(--green); }
  .error-msg{ color:var(--red); font-size:0.8rem; margin-top:10px; display:none; }

  /* Admin panel */
  #admin-view{ display:none; }
  .add-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:24px; }
  .add-card h2{ font-size:1rem; margin-bottom:14px; }
  .form-grid{ display:grid; grid-template-columns:2fr 1fr; gap:10px; margin-bottom:10px; }
  .form-grid input, .form-grid select{ padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:0.85rem; }
  .form-grid textarea{ grid-column:1/-1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:0.85rem; font-family:inherit; resize:vertical; min-height:50px; }

  .item-row{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap;
  }
  .item-row.unavailable{ opacity:0.5; }
  .item-main{ flex:1; min-width:180px; }
  .item-main .name{ font-weight:700; font-size:0.95rem; }
  .item-main .meta{ font-family:var(--font-mono); font-size:0.72rem; color:#6b6058; margin-top:3px; }
  .item-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .icon-btn{ padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:0.76rem; cursor:pointer; }
  .icon-btn.danger{ color:var(--red); border-color:var(--red); }
  .icon-btn.toggle-on{ background:var(--green); color:#fff; border-color:var(--green); }

  .section-title{ font-family:var(--font-mono); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; color:#6b6058; margin:24px 0 12px; }
</style>
</head>
<body>

<div id="login-view">
  <h1>Espace admin</h1>
  <p>Connectez-vous avec le compte créé dans Supabase (Authentication → Users).</p>
  <div class="field">
    <label>Email</label>
    <input type="email" id="login-email" placeholder="vous@exemple.com">
  </div>
  <div class="field">
    <label>Mot de passe</label>
    <input type="password" id="login-password" placeholder="••••••••">
  </div>
  <button class="btn" id="login-btn">Se connecter</button>
  <p class="error-msg" id="login-error"></p>
</div>

<div id="admin-view">
  <div class="wrap">
    <div class="top">
      <div class="logo"><span>votre</span>RESTAURANT — ADMIN</div>
      <button class="logout-btn" id="logout-btn">Se déconnecter</button>
    </div>

    <div class="add-card">
      <h2>Ajouter un plat</h2>
      <div class="form-grid">
        <input type="text" id="new-name" placeholder="Nom du plat">
        <input type="number" id="new-price" placeholder="Prix (FCFA)">
        <input type="text" id="new-category" placeholder="Catégorie (ex. Burgers)">
        <select id="new-available">
          <option value="true">Disponible</option>
          <option value="false">Indisponible</option>
        </select>
        <textarea id="new-description" placeholder="Description (optionnel)"></textarea>
      </div>
      <button class="btn btn-green" id="add-btn">Ajouter au menu</button>
    </div>

    <div class="section-title">Plats actuels</div>
    <div id="items-list"><p style="font-size:0.85rem; color:#6b6058;">Chargement…</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// À REMPLIR : mêmes identifiants que dans index.html
// ============================================================
const SUPABASE_URL = "https://VOTRE-PROJET.supabase.co";
const SUPABASE_ANON_KEY = "VOTRE_CLE_ANON_PUBLIC";
// ============================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginView = document.getElementById('login-view');
const adminView = document.getElementById('admin-view');

async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    loginView.style.display = 'none';
    adminView.style.display = 'block';
    loadItems();
  } else {
    loginView.style.display = 'block';
    adminView.style.display = 'none';
  }
}

document.getElementById('login-btn').addEventListener('click', async ()=>{
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    errEl.textContent = "Connexion impossible : " + error.message;
    errEl.style.display = 'block';
    return;
  }
  checkSession();
});

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  checkSession();
});

async function loadItems(){
  const { data, error } = await sb
    .from('products')
    .select('*')
    .order('category', { ascending: true })
    .order('sort_order', { ascending: true });

  const listEl = document.getElementById('items-list');
  if(error){
    listEl.innerHTML = `<p style="color:var(--red); font-size:0.85rem;">Erreur de chargement : ${error.message}</p>`;
    return;
  }
  if(!data.length){
    listEl.innerHTML = `<p style="font-size:0.85rem; color:#6b6058;">Aucun plat pour l'instant — ajoutez-en un ci-dessus.</p>`;
    return;
  }

  listEl.innerHTML = data.map(item => `
    <div class="item-row ${item.is_available ? '' : 'unavailable'}" data-id="${item.id}">
      <div class="item-main">
        <div class="name">${item.name} — ${Math.round(item.price).toLocaleString('fr-FR')} FCFA</div>
        <div class="meta">${item.category}${item.description ? ' · ' + item.description : ''}</div>
      </div>
      <div class="item-actions">
        <button class="icon-btn toggle-btn ${item.is_available ? 'toggle-on' : ''}" data-id="${item.id}" data-current="${item.is_available}">
          ${item.is_available ? 'Disponible' : 'Indisponible'}
        </button>
        <button class="icon-btn danger delete-btn" data-id="${item.id}">Supprimer</button>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('.toggle-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.id;
      const current = btn.dataset.current === 'true';
      await sb.from('products').update({ is_available: !current }).eq('id', id);
      loadItems();
    });
  });

  listEl.querySelectorAll('.delete-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Supprimer ce plat définitivement ?')) return;
      await sb.from('products').delete().eq('id', btn.dataset.id);
      loadItems();
    });
  });
}

document.getElementById('add-btn').addEventListener('click', async ()=>{
  const name = document.getElementById('new-name').value.trim();
  const price = parseFloat(document.getElementById('new-price').value);
  const category = document.getElementById('new-category').value.trim() || 'Menu';
  const description = document.getElementById('new-description').value.trim();
  const available = document.getElementById('new-available').value === 'true';

  if(!name || isNaN(price)){
    alert('Merci de renseigner au moins un nom et un prix.');
    return;
  }

  const { error } = await sb.from('products').insert([{ name, price, category, description, is_available: available }]);
  if(error){
    alert("Erreur : " + error.message);
    return;
  }

  document.getElementById('new-name').value = '';
  document.getElementById('new-price').value = '';
  document.getElementById('new-category').value = '';
  document.getElementById('new-description').value = '';
  loadItems();
});

checkSession();
</script>

</body>
</html>
