<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Votre Restaurant — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@1,600;1,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f7ead6; --ink:#141210; --red:#db1f2e; --green:#3f7d4f; --gold:#f2b705;
    --line:rgba(20,18,16,0.14);
    --font-logo:'Anton',sans-serif; --font-display:'Playfair Display',serif;
    --font-mono:'IBM Plex Mono',monospace; --font-body:'Inter',sans-serif;
  }
  html{color-scheme:light; background:var(--cream);}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:var(--font-body); line-height:1.55;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:900px; margin:0 auto; padding:0 22px;}

  header{position:sticky; top:0; z-index:50; background:var(--ink); border-bottom:3px solid var(--red);}
  .header-inner{display:flex; align-items:center; justify-content:space-between; padding:12px 22px;}
  .logo{font-family:var(--font-logo); color:#fff; font-size:1.3rem; line-height:0.95; letter-spacing:0.02em;}
  .logo span{display:block; font-size:0.6rem; color:var(--gold); letter-spacing:0.15em; font-family:var(--font-mono); margin-bottom:2px;}
  .cta{background:var(--red); color:#fff; font-weight:700; font-size:0.8rem; padding:9px 16px; border-radius:2px 10px 2px 10px; border:none;}

  .hero{background:var(--ink); color:#fff; padding:44px 22px 52px; text-align:center;}
  .eyebrow{font-family:var(--font-mono); font-size:0.7rem; color:var(--gold); letter-spacing:0.14em; margin-bottom:14px;}
  h1{font-family:var(--font-display); font-style:italic; font-weight:700; font-size:clamp(1.8rem,5vw,2.6rem); max-width:520px; margin:0 auto;}
  h1 em{color:var(--red); font-style:italic;}
  .hero p{color:rgba(255,255,255,0.7); max-width:440px; margin:16px auto 0; font-size:0.94rem;}

  .section{padding:50px 22px;}
  .section-head{text-align:center; max-width:520px; margin:0 auto 28px;}
  .section-head .eyebrow{color:var(--red);}
  .section-head h2{font-family:var(--font-display); font-style:italic; font-size:clamp(1.4rem,3.2vw,1.9rem);}

  .cat-tabs{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:28px;}
  .cat-tab{padding:8px 16px; border-radius:100px; border:1px solid var(--line); background:#fff; font-size:0.8rem; font-weight:600; color:var(--ink);}
  .cat-tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .menu-grid{display:grid; gap:14px;}
  .ticket{
    background:#fff; border:1px dashed var(--line); border-radius:4px 16px 4px 16px;
    padding:16px 18px; display:flex; align-items:center; gap:14px; position:relative;
  }
  .ticket::before, .ticket::after{content:""; position:absolute; width:14px; height:14px; background:var(--cream); border-radius:50%; top:50%; transform:translateY(-50%);}
  .ticket::before{left:-7px;} .ticket::after{right:-7px;}
  .ticket-info{flex:1;}
  .ticket-info h3{font-family:var(--font-display); font-style:italic; font-size:1.1rem;}
  .ticket-info p{font-size:0.8rem; color:#6b6058; margin-top:3px;}
  .ticket-price{font-family:var(--font-mono); font-weight:700; font-size:0.92rem; margin-top:6px;}
  .stepper{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .step-btn{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--cream); font-size:1.1rem; font-weight:700;}
  .step-val{font-family:var(--font-mono); font-weight:700; min-width:18px; text-align:center;}

  .loading, .empty{text-align:center; color:#6b6058; padding:30px; font-size:0.9rem;}

  .cart-bar{
    position:sticky; bottom:0; z-index:40; background:var(--ink); color:#fff;
    padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .cart-info{font-size:0.85rem;}
  .cart-total{font-family:var(--font-mono); font-weight:700; color:var(--gold);}
  .send-btn{background:var(--red); color:#fff; padding:11px 18px; border-radius:2px 10px 2px 10px; font-weight:700; font-size:0.82rem; border:none;}
  .send-btn:disabled{background:rgba(255,255,255,0.15); color:rgba(255,255,255,0.4);}

  footer{background:var(--ink); color:rgba(255,255,255,0.6); text-align:center; padding:24px; font-size:0.76rem; font-family:var(--font-mono);}
</style>
</head>
<body>

<header>
  <div class="header-inner wrap">
    <div class="logo"><span>votre</span>RESTAURANT</div>
    <a href="#menu" class="cta">Voir le menu</a>
  </div>
</header>

<section class="hero">
  <div class="eyebrow">🔥 FAST FOOD · DAKAR</div>
  <h1>Le meilleur du <em>Fastfood</em></h1>
  <p>Menu à jour en direct — commandez en un clic, la commande part sur WhatsApp.</p>
</section>

<section class="section" id="menu">
  <div class="section-head">
    <div class="eyebrow">La carte</div>
    <h2>Composez votre commande</h2>
  </div>
  <div class="cat-tabs" id="cat-tabs"></div>
  <div class="menu-grid" id="menu-grid">
    <div class="loading">Chargement du menu…</div>
  </div>
</section>

<div class="cart-bar" id="cart-bar">
  <div class="cart-info">
    <span id="cart-label">Aucun article sélectionné</span>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <span class="cart-total" id="cart-total">0 FCFA</span>
    <button class="send-btn" id="send-btn" disabled>Envoyer sur WhatsApp</button>
  </div>
</div>

<footer>Démo — Site pour restaurant · réalisé par Cheikh</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://qoqulrshhiawpqlnuqph.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vcDFlEkjoO_TcnvLYHf-ew_Po9IiSuC"; ============================================================
// À REMPLIR : vos identifiants Supabase (Project Settings > API)
// ============================================================

// ============================================================

const WHATSAPP_NUMBER = "221770000000"; // à remplacer par le vrai numéro

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const cart = {};
let items = [];
let activeCategory = 'Tout';

function fmt(n){ return Math.round(n).toLocaleString('fr-FR') + ' FCFA'; }

async function loadMenu(){
  const { data, error } = await sb
    .from('products')
    .select('*')
    .eq('is_available', true)
    .order('sort_order', { ascending: true });

  if(error){
    document.getElementById('menu-grid').innerHTML =
      `<div class="empty">Impossible de charger le menu. Vérifiez la configuration Supabase.</div>`;
    console.error(error);
    return;
  }
  items = data || [];
  renderTabs();
  renderMenu();
}

function renderTabs(){
  const cats = ['Tout', ...new Set(items.map(i => i.category))];
  const tabsEl = document.getElementById('cat-tabs');
  tabsEl.innerHTML = cats.map(c =>
    `<button class="cat-tab ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`
  ).join('');
  tabsEl.querySelectorAll('.cat-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCategory = btn.dataset.cat;
      renderTabs();
      renderMenu();
    });
  });
}

function renderMenu(){
  const grid = document.getElementById('menu-grid');
  const filtered = activeCategory === 'Tout' ? items : items.filter(i => i.category === activeCategory);

  if(!filtered.length){
    grid.innerHTML = `<div class="empty">Aucun plat dans cette catégorie pour le moment.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => `
    <div class="ticket">
      <div class="ticket-info">
        <h3>${item.name}</h3>
        <p>${item.description || ''}</p>
        <div class="ticket-price">${fmt(item.price)}</div>
      </div>
      <div class="stepper">
        <button class="step-btn" data-id="${item.id}" data-dir="-1">−</button>
        <span class="step-val" id="qty-${item.id}">${cart[item.id]?.qty || 0}</span>
        <button class="step-btn" data-id="${item.id}" data-dir="1">+</button>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.step-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = items.find(i => i.id === btn.dataset.id);
      const dir = parseInt(btn.dataset.dir, 10);
      if(!cart[item.id]) cart[item.id] = { name: item.name, price: item.price, qty: 0 };
      cart[item.id].qty = Math.max(0, cart[item.id].qty + dir);
      if(cart[item.id].qty === 0) delete cart[item.id];
      document.getElementById(`qty-${item.id}`).textContent = cart[item.id]?.qty || 0;
      renderCart();
    });
  });
}

function renderCart(){
  const entries = Object.values(cart);
  const count = entries.reduce((s,v)=>s+v.qty, 0);
  const total = entries.reduce((s,v)=>s+v.qty*v.price, 0);
  document.getElementById('cart-label').textContent = count
    ? `${count} article${count>1?'s':''} sélectionné${count>1?'s':''}`
    : 'Aucun article sélectionné';
  document.getElementById('cart-total').textContent = fmt(total);
  document.getElementById('send-btn').disabled = count === 0;
}

document.getElementById('send-btn').addEventListener('click', ()=>{
  const entries = Object.values(cart);
  if(!entries.length) return;
  const total = entries.reduce((s,v)=>s+v.qty*v.price, 0);
  let msg = "Bonjour, je souhaite commander :%0A";
  entries.forEach(v => { msg += `— ${v.name} x${v.qty} : ${fmt(v.qty*v.price)}%0A`; });
  msg += `%0ATotal : ${fmt(total)}`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank');
});
loadMenu();
</script>

</body>
</html>
